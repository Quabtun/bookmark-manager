appId: com.bookmark.manager
productName: BookmarkManager
directories:
  output: release7
  buildResources: build
files:
  - dist/**/*
  - dist-electron/**/*
extraResources:
  - from: node_modules/maxmind/LICENSE
    to: licenses/maxmind/LICENSE
publish:
  provider: github
  owner: Quantum-and-photon
  repo: bookmark-manager
  releaseType: release
win:
  target:
    - target: portable
      arch: [x64]
  icon: build/icon.ico
  signAndEditExecutable: false
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: BookmarkManager
  uninstallDisplayName: BookmarkManager
portable:
  artifactName: ${productName}-${version}-portable.exe
