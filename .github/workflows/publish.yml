name: Publish Public Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build-and-publish:
    runs-on: windows-latest
    steps:
      - name: Checkout private source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Verify tag matches package version
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          if ($env:GITHUB_REF_NAME -ne "v$version") {
            throw "Tag $env:GITHUB_REF_NAME must match package.json version v$version"
          }

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build portable Windows package
        run: npm run build

      - name: Publish files to public repository
        uses: softprops/action-gh-release@v2
        with:
          repository: Quabtun/bookmark-manager-releases
          token: ${{ secrets.RELEASES_REPO_TOKEN }}
          tag_name: ${{ github.ref_name }}
          name: Bookmark Manager ${{ github.ref_name }}
          body: |
            ## 修复
            - 修复点击父分类文件夹时未显示子文件夹书签的问题。
            - 校验与预览任务改为独立执行，可同时运行。
            - 进度面板可同时展示校验与预览进度，操作按钮仅在对应任务运行时禁用。

            ## 验证
            - npm test：通过。
            - Windows x64 便携版已构建。
          generate_release_notes: false
          fail_on_unmatched_files: true
          files: release7/BookmarkManager-*-portable.exe
